# GDScript half: dot-ci's validate (parse every script, run the suites, which exercise the
# GDScript twins). Native half: build the library for every desktop platform in
# ci/targets.tsv, and the web side module (job web, ci/web.sh). A plain web export runs the
# GDScript twins; only a dlink web export loads the side module, so a native build is optional. The native jobs skip
# with a notice until rust/Cargo.toml exists, and a red native job never stops the GDScript
# half from reporting.
name: CI

on:
    push:
        branches: ['**']
        paths-ignore:
            - '**/*.md'
    pull_request:
    workflow_dispatch:

jobs:
    validate:
        uses: modcommunity/dot-ci/.github/workflows/validate.yml@v1
        with:
            efficiency: true
            hygiene: true
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}

    matrix-check:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v4
            - name: ci/ scripts parse, the matrix is whole, the web row is the side module
              run: bash ci/check.sh

    native:
        needs: matrix-check
        name: native ${{ matrix.platform }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x86_64
                      target: x86_64-unknown-linux-gnu
                      runner: ubuntu-22.04
                    - platform: linux-arm64
                      target: aarch64-unknown-linux-gnu
                      runner: ubuntu-22.04-arm
                    - platform: windows-x86_64
                      target: x86_64-pc-windows-msvc
                      runner: windows-2022
                    - platform: macos-arm64
                      target: aarch64-apple-darwin
                      runner: macos-14
                    - platform: macos-x86_64
                      target: x86_64-apple-darwin
                      runner: macos-15-intel
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
            - name: Is there a crate yet
              id: crate
              run: |
                  if [ -f rust/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
                  else echo "::notice::rust/Cargo.toml not found: native build skipped"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
            - name: Rust toolchain
              if: steps.crate.outputs.present == 'true'
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              if: steps.crate.outputs.present == 'true'
              with:
                  workspaces: rust
                  key: ${{ matrix.platform }}
            - name: fmt and clippy (one platform is enough)
              if: steps.crate.outputs.present == 'true' && matrix.platform == 'linux-x86_64'
              run: |
                  cargo fmt --all --manifest-path rust/Cargo.toml --check
                  cargo clippy --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --locked -- -D warnings
            - name: Unit tests (the library's own, no engine needed)
              if: steps.crate.outputs.present == 'true'
              run: cargo test --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --locked
            - name: Build and lay out the library
              if: steps.crate.outputs.present == 'true'
              run: bash ci/install.sh --platform ${{ matrix.platform }}
            - uses: actions/upload-artifact@v4
              if: steps.crate.outputs.present == 'true'
              with:
                  name: dot_sim-${{ matrix.platform }}
                  path: addons/dot_sim/bin/${{ matrix.platform }}
                  retention-days: 7

    # The web side module (docs/web.md): the pinned nightly with rust-src (-Zbuild-std), emsdk 3.1.74, and a
    # Godot binary for godot-rust's api-custom. Built from the same crate as the desktop rows; a dlink
    # nothreads web export loads it, a plain one runs the GDScript twins.
    web:
        needs: matrix-check
        name: native ${{ matrix.platform }}
        runs-on: ubuntu-22.04
        timeout-minutes: 40
        strategy:
            matrix:
                include:
                    - platform: web-wasm32
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  path: project
            - name: A crate is required
              run: |
                  [ -f project/rust/Cargo.toml ] || { echo "::notice::no rust/Cargo.toml: no web build"; echo "SKIP=1" >> "$GITHUB_ENV"; }
            - uses: actions/checkout@v4
              if: env.SKIP != '1'
              with:
                  repository: modcommunity/dot-ci
                  ref: v1
                  path: dot-ci
            - name: Godot for the API dump
              if: env.SKIP != '1'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
                  GODOT="$(dot-ci/scripts/fetch-godot.sh --dest ~/.godot-ci/$(dot-ci/scripts/fetch-godot.sh --version))"
                  echo "GODOT4_BIN=$GODOT" >> "$GITHUB_ENV"
            - name: Pinned nightly (must match NIGHTLY in ci/web.sh)
              if: env.SKIP != '1'
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-01-10
                  targets: wasm32-unknown-emscripten
                  components: rust-src
            - uses: mymindstorm/setup-emsdk@v14
              if: env.SKIP != '1'
              with:
                  version: 3.1.74
            - uses: Swatinem/rust-cache@v2
              if: env.SKIP != '1'
              with:
                  workspaces: project/rust
                  key: web-wasm32
            - name: Build and lay out the side module
              if: env.SKIP != '1'
              run: bash project/ci/web.sh
            - uses: actions/upload-artifact@v4
              if: env.SKIP != '1'
              with:
                  name: dot_sim-web-wasm32
                  path: project/addons/dot_sim/bin/web-wasm32
                  retention-days: 7

    # The suites again, with the library loaded: validate above runs them with no library, so
    # only the script fallback. Here every native module is checked against its script twin
    # (sim_selftest: bots; snapshot_selftest: the snapshot codec against dot-net's, golden
    # bytes, decode parity, lossy 22/33 Hz runs with interest rings). DOT_SIM_REQUIRE_NATIVE
    # makes a library that failed to load a failure instead of a skip.
    native-suites:
        needs: matrix-check
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v4
              with:
                  path: project
            - uses: actions/checkout@v4
              with:
                  repository: modcommunity/dot-ci
                  ref: v1
                  path: dot-ci
            - name: Install the runtime's shared libraries
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
            - name: Fetch the pinned runtime
              run: |
                  GODOT="$(dot-ci/scripts/fetch-godot.sh --dest ~/.godot-ci/$(dot-ci/scripts/fetch-godot.sh --version))"
                  echo "GODOT=$GODOT" >> "$GITHUB_ENV"
                  "$GODOT" --version
            - name: Resolve the addons this project declares
              env:
                  DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
              run: dot-ci/scripts/resolve-deps.sh project
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: project/rust
                  key: native-suites
            - name: Build and install the library
              run: bash project/ci/install.sh --platform linux-x86_64
            - name: The suites, native loaded
              env:
                  DOT_SIM_REQUIRE_NATIVE: '1'
                  SUITES: examples/sim_selftest examples/snapshot_selftest
              run: dot-ci/scripts/check.sh project
