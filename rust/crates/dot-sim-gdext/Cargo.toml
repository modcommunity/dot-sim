[package]
name = "dot-sim-gdext"
description = "The GDExtension: thin engine bindings over the pure crates, one cargo feature per module."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dot_sim"
crate-type = ["cdylib"]

[dependencies]
godot = "0.5.5"
dot-sim-bots = { path = "../dot-sim-bots", optional = true }
dot-sim-brain = { path = "../dot-sim-brain", optional = true }
dot-sim-snapshot = { path = "../dot-sim-snapshot", optional = true }
dot-sim-interp = { path = "../dot-sim-interp", optional = true }
dot-sim-motor = { path = "../dot-sim-motor", optional = true }
dot-sim-arms = { path = "../dot-sim-arms", optional = true }
dot-sim-audio = { path = "../dot-sim-audio", optional = true }
dot-sim-math = { path = "../dot-sim-math", optional = true }

[features]
default = ["bots", "brain", "snapshot", "interp", "motor", "arms", "audio", "ragdoll"]
bots = ["dep:dot-sim-bots"]
brain = ["dep:dot-sim-brain", "bots"]
snapshot = ["dep:dot-sim-snapshot"]
interp = ["dep:dot-sim-interp"]
motor = ["dep:dot-sim-motor"]
arms = ["dep:dot-sim-arms"]
audio = ["dep:dot-sim-audio"]
ragdoll = ["dep:dot-sim-math"]
# A web side module (wasm32-unknown-emscripten, nightly, -Zbuild-std); see docs/web.md.
web = ["godot/api-custom", "godot/experimental-wasm", "godot/lazy-function-tables"]
web-nothreads = ["web", "godot/experimental-wasm-nothreads"]
